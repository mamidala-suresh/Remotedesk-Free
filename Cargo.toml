[workspace]
members = [
    "crates/remotedesk-core",
    "crates/remotedesk-capture",
    "crates/remotedesk-server",
    "crates/remotedesk-app",
    "crates/remotedesk-tests",
]
resolver = "2"

[workspace.package]
version = "1.1.0"
authors = ["Suresh Mamidala <Freeware>"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/remotedesk-free/remotedesk-free"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
