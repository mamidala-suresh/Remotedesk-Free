# ===================================================================
# coturn TURN/STUN Server Configuration for RemoteDesk Free
# ===================================================================

# Network listening ports
listening-port=3478
tls-listening-port=5349
alt-listening-port=3479
alt-tls-listening-port=5350

# Listening IP addresses (0.0.0.0 listens on all interfaces)
listening-ip=0.0.0.0

# Relay IP addresses (Min/Max ports for dynamic UDP allocation)
min-port=49152
max-port=65535

# Authentication: Time-windowed ephemeral credentials (RFC 5766)
use-auth-secret
static-auth-secret=remotedesk_turn_secret_2026
realm=remotedesk.local

# Security & Protocol Options
fingerprint
lt-cred-mech
stale-nonce=600

# DoS and Amplification Attack Protection
max-allocate-per-user=50
total-quota=1000
bps-capacity=0

# Deny loopback allocation to protect internal host services
no-loopback-peers
no-multicast-peers

# Logging
verbose
log-file=stdout
